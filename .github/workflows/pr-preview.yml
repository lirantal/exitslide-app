name: PR preview
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number
        required: true
        type: number
  pull_request_target:
    branches: [main]
    types: [closed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: exitslide-preview-pr-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Resolve same-repository PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -er --arg repo "$GITHUB_REPOSITORY" '
            select(.state == "open" and .base.ref == "main" and .head.repo.full_name == $repo) | .head.sha
          ')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @exitslide/frontend exec vite build --mode pr-preview
        env:
          CLOUDFLARE_PREVIEW_BUILD: 'true'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:preview
      - uses: actions/upload-artifact@v4
        with:
          name: pr-preview-build
          path: frontend/.cloudflare/output/v1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
  publish:
    needs: build
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' ||
        (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The publishing runner executes the default branch tooling, even on PR close.
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: pr-preview-build
          path: frontend/.cloudflare/output/v1
      - name: Validate and publish preview
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ needs.build.outputs.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID for preview publishing}"
          : "${CLOUDFLARE_API_TOKEN:?Add the preview-scoped CLOUDFLARE_PREVIEW_API_TOKEN repository secret}"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if ! jq -e --arg sha "$PR_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha
          ' <<< "$pr" >/dev/null; then
            echo "PR closed or changed during the build. Run PR preview again for the new commit."
            exit 0
          fi

          output=frontend/.cloudflare/output/v1
          test "$(find "$output/workers" -mindepth 1 -maxdepth 1 -printf '%f\n')" = default
          test -z "$(find "$output" -type l -print -quit)"
          jq -e '.buildContext == {isPreview:true,mode:"pr-preview"} and
            ((keys - ["producer","buildContext"]) | length == 0)' "$output/config.json" >/dev/null
          jq -e '.name == "exitslide-pr-preview" and .workersDev == false and
            .manifest == {type:"partial",mainModule:"index.js",modules:{}} and
            ((keys - ["name","compatibilityDate","compatibilityFlags","observability","workersDev","manifest"]) | length == 0)
          ' "$output/workers/default/worker.config.json" >/dev/null

          pnpm --filter @exitslide/frontend exec cf previews deploy --prebuilt --mode pr-preview \
            --preview-name "pr-$PR_NUMBER" > "$RUNNER_TEMP/preview.json"
          url=$(jq -er '[.preview_urls | .. | strings | select(test("^https://[a-z0-9.-]+\\.workers\\.dev/?$"))][0]' "$RUNNER_TEMP/preview.json")
          curl -fsS --retry 4 --retry-all-errors --max-time 15 "${url%/}/healthz" | jq -e '.service == "exitslide-pr-preview" and .status == "ok"' >/dev/null
          printf '### [Open PR #%s preview](%s)\n\nCommit `%s`. Sample data stays in your browser.\n' "$PR_NUMBER" "$url" "$PR_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove closed PR preview
        if: github.event_name == 'pull_request_target'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Preview publishing has no token configured."
            exit 0
          fi
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID for preview cleanup}"
          if ! pnpm exec cf previews delete "pr-$PR_NUMBER" --worker exitslide-pr-preview --force > "$RUNNER_TEMP/preview-delete.log" 2>&1; then
            if grep -q '404 Not Found' "$RUNNER_TEMP/preview-delete.log"; then
              echo "No preview exists for this PR."
            else
              cat "$RUNNER_TEMP/preview-delete.log" >&2
              exit 1
            fi
          fi
