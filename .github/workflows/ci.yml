name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && 'exitslide-production' || format('exitslide-verify-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Verify the fixture preview locally
        if: github.event_name == 'pull_request'
        run: |
          CLOUDFLARE_PREVIEW_BUILD=true pnpm --filter @exitslide/frontend exec vite build --mode pr-preview
          pnpm test:e2e:preview
  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      EXITSLIDE_D1_ID: ${{ secrets.EXITSLIDE_D1_ID || vars.EXITSLIDE_D1_ID }}
    outputs:
      deployed: ${{ steps.frontend.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build both production Workers
        run: |
          pnpm --filter @exitslide/backend exec vite build --mode release
          pnpm --filter @exitslide/frontend exec vite build --mode release
      - name: Check production configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXITSLIDE_WORKOS_SMOKE_API_KEY: ${{ secrets.EXITSLIDE_WORKOS_SMOKE_API_KEY }}
          EXITSLIDE_LIVE_URL: ${{ vars.EXITSLIDE_LIVE_URL }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID as a repository secret or variable}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${EXITSLIDE_WORKOS_SMOKE_API_KEY:?Set the EXITSLIDE_WORKOS_SMOKE_API_KEY repository secret}"
          if [[ "$EXITSLIDE_WORKOS_SMOKE_API_KEY" != sk_test_?* ]]; then
            echo 'Set EXITSLIDE_WORKOS_SMOKE_API_KEY to a WorkOS test API key.' >&2
            exit 1
          fi
          pnpm test:e2e:live --list
          pnpm exec cf d1 get "$EXITSLIDE_D1_ID" | jq -e --arg id "$EXITSLIDE_D1_ID" \
            '.name == "exitslide" and .uuid == $id' >/dev/null
          pnpm exec cf workers secrets list --worker exitslide-frontend | jq -e \
            '(["WORKOS_CLIENT_ID", "WORKOS_REDIRECT_URI", "WORKOS_COOKIE_PASSWORD"] - map(.name)) | length == 0' >/dev/null
      - name: Check the verified commit still heads main
        id: current
        run: |
          read -r head _ <<< "$(git ls-remote --exit-code origin refs/heads/main)"
          : "${head:?Could not resolve GitHub main}"
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'This commit was superseded on main. Skipping production deploy.'
          fi
      - name: Apply D1 migrations
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec cf d1 migrations apply "$EXITSLIDE_D1_ID" --dir backend/drizzle
      - name: Deploy private backend
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @exitslide/backend exec cf deploy --prebuilt --no-provision --tag "$GITHUB_SHA"
      - name: Deploy frontend
        id: frontend
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter @exitslide/frontend exec cf deploy --prebuilt --no-provision --tag "$GITHUB_SHA"
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
  live-smoke:
    name: Verify live deployment
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    uses: ./.github/workflows/live-smoke.yml
    secrets:
      EXITSLIDE_WORKOS_SMOKE_API_KEY: ${{ secrets.EXITSLIDE_WORKOS_SMOKE_API_KEY }}
